name: Compilar per a macOS (DMG + ZIP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4

      - name: 1.5. Instal·lar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: 2. Configuració de Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'pnpm'

      - name: 3. Instal·lació de dependències del projecte (pnpm)
        run: pnpm install --frozen-lockfile

      - name: 4. Create google-credentials.json from secret
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > google-credentials.json
      
      - name: 5. Create service-account.json from secret
        env:
          SERVICE_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_JSON" > service-account.json

      - name: 6. Comprova que google-credentials.json existeix i no està buit
        run: |
          if [ ! -s google-credentials.json ]; then
            echo "El fitxer google-credentials.json està buit o no existeix!"
            exit 1
          fi

      - name: 6.5 Preparar variables de nom
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '_')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: 7. Compilació de l'aplicació per a macOS
        run: pnpm run build:mac

      - name: 8. Preparar fitxers per a l'artefacte
        run: |
          mkdir -p GEP_Artifact
          
          # Busquem el DMG i el copiem
          DMG_FILE=$(find releases -name "*.dmg" -type f -maxdepth 1 | head -n 1)
          cp "$DMG_FILE" GEP_Artifact/
          
          # Copiem la documentació
          cp LICENSE README.md DEVELOPING.md GEP_Artifact/
          cp -r "examples json" GEP_Artifact/
          
          # Nom de l'artefacte (sense .zip)
          ARTIFACT_NAME="GEP_v${{ env.APP_VERSION }}-${{ env.BRANCH_NAME }}-build${{ env.BUILD_NUMBER }}-macOS"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: 9. Pujada de la carpeta com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: GEP_Artifact/