name: Compilar per a Linux (AppImage)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4

      - name: 2. Configuració de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instal·lació de dependències del sistema per a Ubuntu 22.04
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libgtk-3-dev \
            libnss3 \
            libasound2 \
            libxtst-dev \
            libxss1 \
            libappindicator3-1

      - name: 4. Instal·lació de dependències del projecte (npm)
        run: npm install

      - name: 4.5 Create google-credentials.json from secret
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > google-credentials.json
        
      - name: 4.6 Create service-account.json from secret
        env:
          SERVICE_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_JSON" > service-account.json
                
      - name: Comprova que google-credentials.json existeix i no està buit
        run: |
          if [ ! -s google-credentials.json ]; then
            echo "El fitxer google-credentials.json està buit o no existeix!"
            exit 1
          fi

      - name: Mostra la mida del fitxer google-credentials.json (debug)
        run: ls -lh google-credentials.json

      - name: DEBUG Mostra el contingut RAW de google-credentials.json
        run: cat -A google-credentials.json

      - name: Comprova que el fitxer és JSON vàlid
        run: |
          if ! jq empty google-credentials.json; then
            echo "El fitxer google-credentials.json NO és JSON vàlid!"
            exit 1
          fi
        shell: bash

      - name: Comprova que el fitxer conté la clau 'installed'
        run: |
          if ! jq -e '.installed' google-credentials.json > /dev/null; then
            echo "El fitxer google-credentials.json NO conté la clau 'installed'!"
            exit 1
          fi
        shell: bash

      - name: 4.9 Preparar variables de nom (Branca i Build)
        run: |
          # Sanejar el nom de la branca (substituir / per _)
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '_')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: 5. Compilació de l'aplicació per a Linux
        # Les variables ja estan a l'entorn pel pas anterior
        run: npm run build:electron -- --linux --x64 --publish never

      - name: 6. Preparar fitxers per a l'artefacte
        id: prep_artifact
        run: |
          # Creem una carpeta temporal
          mkdir -p GEP_Artifact
          
          # Busquem i copiem l'AppImage
          APPIMAGE_FILE=$(find releases -name "*.AppImage" -type f -printf "%f\n" | head -n 1)
          cp "releases/${APPIMAGE_FILE}" GEP_Artifact/
          
          # Copiem la documentació i exemples
          cp LICENSE README.md DEVELOPING.md GEP_Artifact/
          cp -r "examples json" GEP_Artifact/
          
          # Nom del ZIP final (sense l'extensió .zip)
          ARTIFACT_NAME="GEP_v${{ env.APP_VERSION }}-${{ env.BRANCH_NAME }}-build${{ env.BUILD_NUMBER }}-Linux"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: 7. Pujada de la carpeta com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep_artifact.outputs.artifact_name }}
          path: GEP_Artifact/
