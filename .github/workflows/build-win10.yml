name: Compilar EXE per a Windows (Projecte Electron)

on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # 1. Descarrega el codi del teu repositori
    - name: Checkout del codi
      uses: actions/checkout@v4

    # 2. Configura l'entorn de Node.js per poder utilitzar pnpm
    - name: Configuració de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Utilitzem una versió recent de Node.js

    # 3. Instal·la totes les dependències del package.json
    - name: Instal·lació de dependències del projecte
      run: pnpm install --frozen-lockfile
      
    - name: 4.5 Create google-credentials.json from secret
      env:
        CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: echo "%CREDENTIALS_JSON%" > google-credentials.json
      shell: cmd

    - name: 4.6 Create service-account.json from secret
      env:
        SERVICE_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: echo "%SERVICE_JSON%" > service-account.json
      shell: cmd

    - name: Comprova que google-credentials.json existeix i no està buit
      shell: cmd
      run: |
          if not exist google-credentials.json (
            echo "El fitxer google-credentials.json NO existeix!" && exit 1
          )
          for %%A in (google-credentials.json) do if %%~zA lss 10 (
            echo "El fitxer google-credentials.json està buit o massa petit!" && exit 1
          )

    - name: Preparar variables de nom
      shell: pwsh
      run: |
        $safeBranch = "${{ github.ref_name }}" -replace '/', '_'
        echo "BRANCH_NAME=$safeBranch" >> $env:GITHUB_ENV
        echo "BUILD_NUMBER=${{ github.run_number }}" >> $env:GITHUB_ENV
        $appVersion = node -p "require('./package.json').version"
        echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

    # (El pas 4 de compilació es manté igual, agafarà les variables automàticament)
    - name: Compilació i empaquetat de l'aplicació
      env:
        GH_TOKEN: ""
      run: pnpm run build:electron -- --win --x64 --publish never

    # 5. Preparar carpeta d'artefactes
    - name: Preparar carpeta d'artefactes
      id: prep_windows
      shell: pwsh
      run: |
        # Creem carpeta temporal
        New-Item -ItemType Directory -Force -Path "GEP_Artifact"
        
        # Copiem els executables
        Get-ChildItem -Path "releases" -Filter "*.exe" | Copy-Item -Destination "GEP_Artifact"
        
        # Copiem documentació i exemples
        Copy-Item -Path "LICENSE", "README.md", "DEVELOPING.md" -Destination "GEP_Artifact"
        Copy-Item -Path "examples json" -Destination "GEP_Artifact" -Recurse
        
        # Definim el nom de l'artefacte (sense .zip)
        $artifactName = "GEP_v${{ env.APP_VERSION }}-${{ env.BRANCH_NAME }}-build${{ env.BUILD_NUMBER }}-Windows"
        echo "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

    # 6. Pujada de l'artefacte
    - name: Pujada de la carpeta com a artefacte
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prep_windows.outputs.artifact_name }}
        path: GEP_Artifact/=$artifactName" >> $env:GITHUB_OUTPUT

    # 6. Pujada de l'artefacte
    - name: Pujada de la carpeta com a artefacte
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prep_windows.outputs.artifact_name }}
        path: GEP_Artifact/