name: Compilar APK per a Android (Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4

      - name: 2. Configuració de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: 3. Configuració de Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instal·lació de dependències del projecte mòbil
        working-directory: ./mobile_app
        run: npm install --legacy-peer-deps

      - name: 5. Generar el projecte nadiu Android
        working-directory: ./mobile_app
        run: npx expo prebuild --platform android --no-install

      - name: 6. Configurar la signatura de Release amb la clau de Debug
        working-directory: ./mobile_app/android/app
        run: |
          echo "" >> build.gradle
          echo "android.buildTypes.release.signingConfig = android.buildTypes.debug.signingConfig" >> build.gradle

      - name: 7. Donar permisos d'execució a gradlew
        working-directory: ./mobile_app/android
        run: chmod +x ./gradlew

      - name: 8. Cau de les dependències de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile_app/android/**/build.gradle*', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 9. Compilar l'APK de Release amb Gradle
        working-directory: ./mobile_app/android
        run: ./gradlew assembleRelease

      - name: 10. Pujada de l'APK com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: GestorEsdevenimentsPersonal-Android-Release.apk
          path: mobile_app/android/app/build/outputs/apk/release/app-release.apk
