name: Compilar APK per a Android (Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4

      - name: 1.5. Instal·lar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: 2. Configuració de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mobile_app/pnpm-lock.yaml

      - name: 3. Configuració de Java (JDK)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instal·lació de dependències del projecte mòbil
        working-directory: ./mobile_app
        run: rm -rf node_modules && pnpm install --frozen-lockfile && pnpm exec expo install --fix

      - name: 5. Clean Native Directories
        working-directory: ./mobile_app
        run: rm -rf android ios

      - name: 6. Generar el projecte natiu Android
        working-directory: ./mobile_app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: 7. Fix Gradle Version to 8.6
        working-directory: ./mobile_app
        run: |
          # Fix Gradle wrapper to use version 8.6 instead of 8.8
          sed -i 's/gradle-8\.8-all\.zip/gradle-8.6-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8\.8-bin\.zip/gradle-8.6-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          # Also update the distributionUrl if it exists
          sed -i 's/distributionUrl=.*gradle-8\.8.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.6-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: 8. Configurar la signatura de Release amb la clau de Debug
        working-directory: ./mobile_app/android/app
        run: |
          echo "" >> build.gradle
          echo "android.buildTypes.release.signingConfig = android.buildTypes.debug.signingConfig" >> build.gradle

      - name: 9. Donar permisos d'execució a gradlew
        working-directory: ./mobile_app/android
        run: chmod +x ./gradlew

      - name: 10. Cau de les dependències de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile_app/android/**/build.gradle*', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 11. Compilar l'APK de Release amb Gradle
        working-directory: ./mobile_app/android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: ./gradlew assembleRelease

      - name: 11.5 Renombrar APK amb GEP, branca i build
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '_')
          
          # Nou nom GEP
          NEW_NAME="GEP-Android-Release-${SAFE_BRANCH}-build${{ github.run_number }}.apk"
          
          # Renombrar l'arxiu original
          mv mobile_app/android/app/build/outputs/apk/release/app-release.apk "$NEW_NAME"
          
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: 12. Pujada de l'APK com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
