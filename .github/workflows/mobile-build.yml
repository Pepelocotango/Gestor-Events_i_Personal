name: Compilar APK per a Android (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4

      - name: 2. Configuració de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: 3. Configuració de Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instal·lació de dependències del projecte mòbil
        working-directory: ./mobile_app
        run: npm install --legacy-peer-deps

      - name: 5. Generar el projecte nadiu Android
        working-directory: ./mobile_app
        run: npx expo prebuild --platform android --no-install

      - name: 6. Donar permisos d'execució a gradlew
        working-directory: ./mobile_app/android
        run: chmod +x ./gradlew

      - name: 7. Compilar l'APK de depuració amb Gradle
        working-directory: ./mobile_app/android
        run: ./gradlew assembleDebug

      - name: 8. Pujada de l'APK com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: GestorEsdevenimentsPersonal-Android-Debug.apk
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
